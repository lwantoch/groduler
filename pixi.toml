[workspace]
authors = ["lwantoch <l.wantoch@icloud.com>"]
channels = ["conda-forge"]
name = "groduler"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
test = "pytest -q"
lint = "ruff check src tests"
fmt = "ruff format src tests"

[dependencies]
python = "3.12.*"
numpy = ">=2.5.0,<3"
scipy = ">=1.18.0,<2"
pandas = ">=3.0.3,<4"
matplotlib = ">=3.11.0,<4"
ruff = ">=0.15.20,<0.16"
pytest = ">=9.1.1,<10"
pre_commit = ">=4.6.0,<5"
